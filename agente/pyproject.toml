[project]
name = "agente"
version = "1.0.0"
description = "Agente A2A / host MCP da Central de Salas - desafio A Ponte"
requires-python = ">=3.10"
dependencies = [
    "mcp==2.3.0",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agente"]
